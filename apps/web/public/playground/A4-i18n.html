<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A4 · i18n</title>
    <style>
      body { font: 14px system-ui, sans-serif; padding: 32px; }
      button { padding: 10px 16px; cursor: pointer; }
      .ok { color: #15803d; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1 data-i18n-key="page.title">Sign in</h1>
    <p>Same DOM, three visible languages. The <code>data-i18n-key</code> is stable across all of them.</p>
    <button data-i18n-key="action.continue">Continue</button>
    <button data-i18n-key="action.cancel">Cancel</button>
    <div id="result" class="ok" hidden></div>
    <script>
      const dict = {
        en: { 'page.title': 'Sign in', 'action.continue': 'Continue', 'action.cancel': 'Cancel' },
        zh: { 'page.title': '登录',  'action.continue': '继续',     'action.cancel': '取消' },
        de: { 'page.title': 'Anmelden', 'action.continue': 'Weiter', 'action.cancel': 'Abbrechen' },
      };
      // Locale source: localStorage wins (set by tests pre-replay), URL second.
      const lang =
        (window.localStorage && localStorage.getItem('lang')) ||
        new URLSearchParams(location.search).get('lang') ||
        'en';
      const strings = dict[lang] || dict.en;
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-i18n-key]')) {
        const k = el.getAttribute('data-i18n-key');
        if (k in strings) el.textContent = strings[k];
      }
      document.querySelectorAll('button').forEach((b) =>
        b.addEventListener('click', () => {
          const r = document.getElementById('result');
          r.hidden = false;
          r.textContent = `clicked: ${b.getAttribute('data-i18n-key')}`;
        }),
      );
    </script>
  </body>
</html>
