[project]
name = "skill-recorder-eval"
version = "0.1.0"
description = "Quantitative evaluation pipeline for Skill Recorder, using WebArena as the benchmark."
requires-python = ">=3.11"
dependencies = [
    # WebArena environment + task wrappers. browsergym pins playwright for us.
    "browsergym-core>=0.13",
    "browsergym-webarena>=0.13",
    # Agent harness — wraps any backbone LLM behind a BrowserGym-compatible interface.
    "agentlab>=0.4",
    # Backbone model.
    "anthropic>=0.42",
    # Results + reporting.
    "pandas>=2.2",
    "tabulate>=0.9",
    # IO.
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
