# 10 WebArena tasks for the MVP eval — shopping_admin domain only.
#
# Why these 10:
#   - All shopping_admin (Magento back-office) per the disk-constrained MVP scope
#   - All have a non-empty `program_html` evaluator → agent must mutate state,
#     not just retrieve info. SKILL.md's value shows on multi-step workflows
#     more than on single-page lookups.
#   - Diverse template families: 22 templates exist in shopping_admin mutations,
#     these 10 cover 6 distinct categories (catalog / orders / reviews / reports /
#     marketing / one bulk-action variant).
#   - Difficulty mix: 2 easy / 5 medium / 3 hard — see `difficulty` field.
#
# id  = the gym env suffix; runner prepends `browsergym/` when calling EnvArgs.
# oracle_source = `authored` until we confirm WebArena publishes reference
#   trajectories per task. Setting it to `reference` once we have a real trace.

