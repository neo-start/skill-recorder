name: Release Chrome extension

on:
  push:
    tags: ['crx-v*']
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @skill-recorder/crx typecheck

      - name: Build CRX
        run: pnpm --filter @skill-recorder/crx build

      - name: Pack zip
        working-directory: apps/crx
        run: |
          cd dist
          zip -r "../../../skill-recorder-${GITHUB_REF_NAME}.zip" .

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: skill-recorder-*.zip
          generate_release_notes: true
